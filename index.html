<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智慧信用卡繳費管家</title>
    
    <!-- iOS PWA 專屬設定：讓網頁在 iPhone 上完美模擬原生 App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="卡費管家">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1155/1155050.png">

    <!-- 引入 PWA 關鍵連結描述檔 -->
    <link rel="manifest" href="manifest.json">

    <!-- 載入 React 18, Babel 與 Tailwind CSS CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 針對 iOS 滿版全螢幕微調，提供頂部與底部安全邊距 */
        body {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* 隱藏滾動條但保持滾動功能 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased select-none">
    <div id="root"></div>

    <!-- 註冊 Service Worker：這是讓 iPhone「捷徑」能找到 App 並發送通知的關鍵技術 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW 註冊成功:', reg.scope))
                    .catch(err => console.log('SW 註冊失敗:', err));
            });
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 精緻內嵌 SVG 圖示 ---
        const CreditCardIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <rect x="2" y="5" width="20" height="14" rx="2" />
                <line x1="2" y1="10" x2="22" y2="10" />
            </svg>
        );

        const BellIcon = ({ className = "w-5 h-5", active = false }) => (
            <svg className={`${className} ${active ? 'animate-bounce' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
        );

        const CalendarIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
        );

        const CheckIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        );

        const AlertIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        );

        const PlusIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
        );

        const LightBulbIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
            </svg>
        );

        // 安全地讀取 LocalStorage
        const safeGetItem = (key, defaultValue) => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : defaultValue;
            } catch (e) {
                console.warn("無法存取 LocalStorage", e);
                return defaultValue;
            }
        };

        // 安全地寫入 LocalStorage
        const safeSetItem = (key, value) => {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                console.warn("寫入 LocalStorage 失敗", e);
            }
        };

        function App() {
            // 固定模擬時間：2026 年 5 月 21 日
            const TODAY = useMemo(() => new Date(2026, 4, 21), []); // 4 代表 5 月

            const [cards, setCards] = useState(() => safeGetItem('reminder_cards', [
                { id: 'sinopac', name: '永豐銀行', dueDate: 15, billCycle: '每月25日結帳', color: 'indigo' },
                { id: 'fubon', name: '富邦銀行', dueDate: 25, billCycle: '每月5日結帳', color: 'blue' }
            ]));

            const [bills, setBills] = useState(() => safeGetItem('reminder_bills', [
                { id: '1', cardId: 'sinopac', year: 2026, month: 5, amount: 13716, isPaid: false },
                { id: '2', cardId: 'fubon', year: 2026, month: 5, amount: 9000, isPaid: false },
                { id: '3', cardId: 'sinopac', year: 2026, month: 6, amount: 0, isPaid: false },
                { id: '4', cardId: 'fubon', year: 2026, month: 6, amount: 0, isPaid: false },
                { id: '5', cardId: 'sinopac', year: 2026, month: 7, amount: 0, isPaid: false },
                { id: '6', cardId: 'fubon', year: 2026, month: 7, amount: 0, isPaid: false }
            ]));

            const [alertDayOfMonth, setAlertDayOfMonth] = useState(() => {
                const saved = safeGetItem('reminder_alert_day', 5);
                return saved;
            });

            const [remindDaysBefore, setRemindDaysBefore] = useState(() => {
                const saved = safeGetItem('reminder_days_before', 3);
                return saved;
            });

            const [isNoonReminderEnabled, setIsNoonReminderEnabled] = useState(() => {
                const saved = safeGetItem('reminder_noon_enabled', true);
                return saved;
            });

            // 介面字體大小縮放比例 (80 - 150)
            const [fontSizeScale, setFontSizeScale] = useState(() => {
                const saved = safeGetItem('reminder_font_size_scale', 100);
                return saved;
            });

            const [notificationPermission, setNotificationPermission] = useState('default');
            const [editingCell, setEditingCell] = useState(null);
            const [editValue, setEditValue] = useState('');
            const [toast, setToast] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [newMonthVal, setNewMonthVal] = useState(8);
            const [showResetConfirm, setShowResetConfirm] = useState(false);

            // 當狀態改變時，寫入 LocalStorage 儲存
            useEffect(() => { safeSetItem('reminder_cards', cards); }, [cards]);
            useEffect(() => { safeSetItem('reminder_bills', bills); }, [bills]);
            useEffect(() => { safeSetItem('reminder_alert_day', alertDayOfMonth); }, [alertDayOfMonth]);
            useEffect(() => { safeSetItem('reminder_days_before', remindDaysBefore); }, [remindDaysBefore]);
            useEffect(() => { safeSetItem('reminder_noon_enabled', isNoonReminderEnabled); }, [isNoonReminderEnabled]);

            // 當字體大小改變時，調整 HTML 根節點的字體尺寸以達到無級全螢幕縮放
            useEffect(() => {
                safeSetItem('reminder_font_size_scale', fontSizeScale);
                document.documentElement.style.fontSize = `${fontSizeScale}%`;
            }, [fontSizeScale]);

            useEffect(() => {
                if ('Notification' in window) {
                    setNotificationPermission(Notification.permission);
                }
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // 核心邏輯：計算特定帳單截止狀態
            const getBillStatus = (bill, card) => {
                if (bill.amount === 0) {
                    return { code: 'EMPTY', text: '待登錄', color: 'text-slate-400 bg-slate-50 border-slate-200', daysLeft: null };
                }
                if (bill.isPaid) {
                    return { code: 'PAID', text: '已繳清', color: 'text-emerald-700 bg-emerald-50 border-emerald-200', daysLeft: null };
                }

                const dueDateObj = new Date(bill.year, bill.month - 1, card.dueDate);
                const diffTime = dueDateObj - TODAY;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays < 0) {
                    return { 
                        code: 'OVERDUE', 
                        text: `已逾期 ${Math.abs(diffDays)} 天`, 
                        color: 'text-rose-700 bg-rose-50 border-rose-200 animate-pulse font-bold', 
                        daysLeft: diffDays 
                    };
                } else if (diffDays <= remindDaysBefore) {
                    return { 
                        code: 'WARNING', 
                        text: `剩餘 ${diffDays} 天`, 
                        color: 'text-amber-700 bg-amber-50 border-amber-200 font-bold', 
                        daysLeft: diffDays 
                    };
                } else {
                    return { 
                        code: 'SAFE', 
                        text: `剩餘 ${diffDays} 天`, 
                        color: 'text-blue-700 bg-blue-50 border-blue-200', 
                        daysLeft: diffDays 
                    };
                }
            };

            const stats = useMemo(() => {
                let totalUnpaid = 0;
                let overdueCount = 0;
                let upcomingCount = 0;
                const alertList = [];

                bills.forEach(bill => {
                    const card = cards.find(c => c.id === bill.cardId);
                    if (!card) return;
                    const status = getBillStatus(bill, card);

                    if (bill.amount > 0 && !bill.isPaid) {
                        totalUnpaid += bill.amount;
                        if (status.code === 'OVERDUE') {
                            overdueCount++;
                            alertList.push({ bill, card, status, priority: 1 });
                        } else if (status.code === 'WARNING') {
                            upcomingCount++;
                            alertList.push({ bill, card, status, priority: 2 });
                        }
                    }
                });

                return { totalUnpaid, overdueCount, upcomingCount, alertList };
            }, [bills, cards, remindDaysBefore]);

            // iOS 原生通知觸發
            const triggerNativeNotification = (title, body) => {
                if (!('Notification' in window)) return false;
                if (Notification.permission === 'granted') {
                    try {
                        const options = {
                            body: body,
                            icon: 'https://cdn-icons-png.flaticon.com/512/1155/1155050.png',
                            badge: 'https://cdn-icons-png.flaticon.com/512/1155/1155050.png',
                            tag: 'card-overdue-alert',
                            requireInteraction: true
                        };
                        new Notification(title, options);
                        return true;
                    } catch (err) {
                        console.error('通知發送失敗:', err);
                        return false;
                    }
                }
                return false;
            };

            // 【核心升級：捷徑開機自動對帳推播】
            // 如果網址帶有 ?source=shortcut，App 在啟動時會自動且立刻對帳，並直接推送系統通知！
            const hasAutoChecked = useRef(false);
            useEffect(() => {
                if (hasAutoChecked.current) return;

                const urlParams = new URLSearchParams(window.location.search);
                const isFromShortcut = urlParams.get('source') === 'shortcut';

                if (isFromShortcut && isNoonReminderEnabled) {
                    hasAutoChecked.current = true;
                    // 延遲 1.2 秒執行，確保 iOS PWA 喚醒完畢且畫面渲染完成
                    const timer = setTimeout(() => {
                        if (stats.overdueCount > 0) {
                            const overdueDetails = stats.alertList
                                .filter(item => item.status.code === 'OVERDUE')
                                .map(item => `【${item.card.name}】$${item.bill.amount.toLocaleString()}`)
                                .join(', ');

                            const title = '🚨 卡費逾期！請立刻繳納';
                            const body = `自動巡檢：您有 ${stats.overdueCount} 筆卡費已逾期 (${overdueDetails})。請立即繳款！`;
                            
                            triggerNativeNotification(title, body);
                            showToast('🔔 捷徑喚醒：已自動發送逾期對帳通知！');
                        } else {
                            showToast('☕ 捷徑喚醒：巡檢完成，今日無逾期帳單。', 'success');
                        }
                    }, 1200);
                    return () => clearTimeout(timer);
                }
            }, [stats.overdueCount, isNoonReminderEnabled]);

            const requestNotificationPermission = async () => {
                if (!('Notification' in window)) {
                    showToast('⚠️ 您的瀏覽器暫不支援網頁通知。請先將本網頁「加入主畫面」後再試！', 'warning');
                    return;
                }

                try {
                    const permission = await Notification.requestPermission();
                    setNotificationPermission(permission);
                    if (permission === 'granted') {
                        showToast('🎉 通知權限授權成功！');
                        triggerNativeNotification('🔔 卡費管家', '中午定時巡檢通知已成功開啟！');
                    } else {
                        showToast('😢 權限遭拒。請前往 iPhone 的「設定」>「通知」>「卡費管家」開啟通知。', 'warning');
                    }
                } catch (e) {
                    showToast('請先將此網頁「加入主畫面」成為桌面 App 才能開啟通知！', 'warning');
                }
            };

            // 手動模擬
            const simulateNoonCheck = () => {
                if (!isNoonReminderEnabled) {
                    showToast('您已在設定中關閉了中午提醒。', 'info');
                    return;
                }

                if (stats.overdueCount > 0) {
                    const overdueDetails = stats.alertList
                        .filter(item => item.status.code === 'OVERDUE')
                        .map(item => `【${item.card.name}】$${item.bill.amount.toLocaleString()}`)
                        .join(', ');

                    const title = '🚨 卡費逾期！請立刻繳納';
                    const body = `提醒：您有 ${stats.overdueCount} 筆卡費過期了 (${overdueDetails})。繳費完請記得到 App 內勾選已繳！`;
                    
                    const sent = triggerNativeNotification(title, body);
                    if (sent) {
                        showToast('🔔 成功在手機系統頂部彈出「逾期通知推播」！');
                    } else {
                        showToast(`📱 手機模擬通知：\n${title}\n${body}`, 'warning');
                    }
                } else {
                    showToast('☕ 中午檢查完成：目前沒有任何逾期帳單。您真守信！', 'success');
                }
            };

            const handleSaveAmount = (billId) => {
                const numVal = parseFloat(editValue);
                if (isNaN(numVal) || numVal < 0) {
                    showToast('請輸入正確的金額數字', 'error');
                    return;
                }
                setBills(prev => prev.map(b => b.id === billId ? { ...b, amount: numVal } : b));
                setEditingCell(null);
                showToast('帳單金額已更新並安全儲存！ 💾');
            };

            const togglePaid = (billId) => {
                setBills(prev => prev.map(b => {
                    if (b.id === billId) {
                        const nextState = !b.isPaid;
                        showToast(nextState ? '🎉 已標記為已繳清！中午不會再跳出通知了。' : '帳單已被設定回未繳狀態。', nextState ? 'success' : 'info');
                        return { ...b, isPaid: nextState };
                    }
                    return b;
                }));
            };

            const addNewMonthRow = () => {
                const monthStr = newMonthVal;
                const exist = bills.some(b => b.month === monthStr && b.year === 2026);
                if (exist) {
                    showToast(`${monthStr} 月份已存在！`, 'error');
                    return;
                }

                const newBills = cards.map(card => ({
                    id: `new-${monthStr}-${card.id}`,
                    cardId: card.id,
                    year: 2026,
                    month: monthStr,
                    amount: 0,
                    isPaid: false
                }));

                setBills(prev => [...prev, ...newBills]);
                showToast(`成功建立 ${monthStr} 月份對照表！`);
                setNewMonthVal(prev => prev === 12 ? 1 : prev + 1);
            };

            const handleReset = () => {
                try {
                    localStorage.clear();
                    window.location.reload();
                } catch(e) {
                    showToast('重置失敗', 'error');
                }
            };

            const monthsData = useMemo(() => {
                const uniqueMonths = Array.from(new Set(bills.map(b => b.month))).sort((a, b) => a - b);
                return uniqueMonths.map(m => {
                    const rowBills = {};
                    cards.forEach(c => {
                        rowBills[c.id] = bills.find(b => b.month === m && b.cardId === c.id);
                    });
                    return { month: m, rowBills };
                });
            }, [bills, cards]);

            return (
                <div className="min-h-screen bg-slate-50 pb-16">
                    
                    {/* iOS 風格的確定重設對話框 */}
                    {showResetConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl p-6 max-w-xs w-full shadow-2xl border border-slate-100 text-center">
                                <h3 className="font-bold text-slate-900 text-base">確認要清除資料嗎？</h3>
                                <p className="text-xs text-slate-500 mt-2 leading-relaxed">
                                    此動作將會還原為最初的預設範例，您自己登錄的帳單紀錄與截止日會被完全清空。
                                </p>
                                <div className="mt-5 flex flex-col space-y-2">
                                    <button 
                                        onClick={handleReset}
                                        className="w-full py-2.5 text-xs font-bold text-white bg-rose-600 active:bg-rose-700 rounded-xl active:scale-95 transition-transform"
                                    >
                                        確定重設
                                    </button>
                                    <button 
                                        onClick={() => setShowResetConfirm(false)}
                                        className="w-full py-2.5 text-xs font-semibold text-slate-500 hover:bg-slate-100 rounded-xl"
                                    >
                                        取消
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* App 頂部狀態列 */}
                    <header className="sticky top-0 z-40 bg-white/95 border-b border-slate-200/80 shadow-sm backdrop-blur-md pt-[calc(env(safe-area-inset-top,0px)+8px)] pb-3 px-4">
                        <div className="max-w-md mx-auto flex flex-col items-center gap-2.5">
                            <div className="flex items-center justify-between w-full">
                                <div className="flex items-center space-x-2.5">
                                    <div className="p-2 bg-indigo-600 rounded-xl text-white shadow-md shadow-indigo-100 shrink-0">
                                        <CreditCardIcon className="w-5 h-5" />
                                    </div>
                                    <div>
                                        <h1 className="text-base font-bold tracking-tight text-slate-950 flex items-center gap-1.5">
                                            卡費管家 <span className="text-[9px] bg-indigo-50 text-indigo-600 font-bold px-1.5 py-0.5 rounded-full">iPhone PWA</span>
                                        </h1>
                                        <p className="text-[9px] text-slate-400">今日模擬：2026年5月21日</p>
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={() => setShowResetConfirm(true)} 
                                    className="text-[10px] text-slate-400 font-medium px-2.5 py-1 rounded-lg border border-slate-200 active:scale-95 transition-transform shrink-0"
                                >
                                    重置資料
                                </button>
                            </div>

                            {/* 蘋果風精緻 Tab 分頁器 */}
                            <div className="flex w-full bg-slate-100 p-1 rounded-xl border border-slate-200/60">
                                <button 
                                    onClick={() => setActiveTab('dashboard')} 
                                    className={`flex-1 py-1.5 text-center rounded-lg text-xs font-bold transition-all active:scale-95 ${activeTab === 'dashboard' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
                                >
                                    記帳提醒
                                </button>
                                <button 
                                    onClick={() => setActiveTab('settings')} 
                                    className={`flex-1 py-1.5 text-center rounded-lg text-xs font-bold transition-all active:scale-95 ${activeTab === 'settings' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
                                >
                                    通知與卡片
                                </button>
                                <button 
                                    onClick={() => setActiveTab('tips')} 
                                    className={`flex-1 py-1.5 text-center rounded-lg text-xs font-bold transition-all active:scale-95 ${activeTab === 'tips' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
                                >
                                    防忘記教學
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* App 主畫面 */}
                    <main className="max-w-md mx-auto px-4 mt-4 space-y-4">
                        
                        {toast && (
                            <div className={`fixed top-4 left-4 right-4 z-50 flex items-center p-3.5 rounded-2xl shadow-xl border backdrop-blur-md transition-all duration-300 transform translate-y-0 ${
                                toast.type === 'success' ? 'bg-emerald-50/95 border-emerald-200 text-emerald-900' :
                                toast.type === 'warning' ? 'bg-rose-50/95 border-rose-200 text-rose-950' :
                                'bg-slate-900/95 text-white border-slate-800'
                            }`}>
                                <div className="mr-2.5 shrink-0">
                                    {toast.type === 'success' && <CheckIcon className="w-5 h-5 text-emerald-600" />}
                                    {toast.type === 'warning' && <AlertIcon className="w-5 h-5 text-rose-600" />}
                                    {toast.type === 'info' && <BellIcon className="w-5 h-5 text-blue-500" />}
                                </div>

                                                </div>
                                                <span className="text-rose-600 font-bold">（⚠️請注意：網址結尾一定要加上 ?source=shortcut，這樣一打開才會全自動對帳並噴出通知！）</span>

                                        每天中午 12:00，iPhone 會自動喚醒並開啟本 App。<strong>只要此時有任何逾期卡費，手機頂部會瞬間震動並自動跳出警告推播通知！</strong>如果今天卡費全部都已經按「一鍵已繳」標記完成了，App 就會保持安靜。
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
