<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智慧信用卡繳費管家</title>
    
    <!-- iOS PWA 專屬設定：讓網頁在 iPhone 上完美模擬原生 App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="卡費管家">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1155/1155050.png">

    <!-- 引入 PWA 關鍵連結描述檔 -->
    <link rel="manifest" href="manifest.json">

    <!-- 載入 React 18, Babel 與 Tailwind CSS CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 針對 iOS 滿版全螢幕微調，提供頂部與底部安全邊距 */
        body {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* 隱藏滾動條並保持滾動功能 */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-200 antialiased select-none bg-[linear-gradient(to_right,rgba(99,102,241,0.04)_1px,transparent_1px),linear-gradient(to_bottom,rgba(99,102,241,0.04)_1px,transparent_1px)] bg-[size:16px_16px]">
    <div id="root"></div>

    <!-- 註冊 Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW 註冊成功:', reg.scope))
                    .catch(err => console.log('SW 註冊失敗:', err));
            });
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const CreditCardIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <rect x="2" y="5" width="20" height="14" rx="2" />
                <line x1="2" y1="10" x2="22" y2="10" />
            </svg>
        );

        const BellIcon = ({ className = "w-4 h-4", active = false }) => (
            <svg className={`${className} ${active ? 'animate-bounce' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
        );

        const CalendarIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
        );

        const CheckIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        );

        const AlertIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        );

        const PlusIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
        );

        const LightBulbIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
            </svg>
        );

        const CloudIcon = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
            </svg>
        );

        // 安全地讀取 LocalStorage
        const safeGetItem = (key, defaultValue) => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : defaultValue;
            } catch (e) {
                console.warn("無法存取 LocalStorage", e);
                return defaultValue;
            }
        };

        // 安全地寫入 LocalStorage
        const safeSetItem = (key, value) => {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                console.warn("寫入 LocalStorage 失敗", e);
            }
        };

        function App() {
            // 抓取真實今天日期
            const TODAY = useMemo(() => new Date(), []); 

            // 動態產生 YYYY-MM-DD 格式的今天日期字串，供頂部面板美觀顯示
            const todayStr = useMemo(() => {
                const y = TODAY.getFullYear();
                const m = String(TODAY.getMonth() + 1).padStart(2, '0');
                const d = String(TODAY.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }, [TODAY]);

            // 【富邦預設值精準同步：每月 2 日結帳，18 日截止繳款】
            const [cards, setCards] = useState(() => safeGetItem('reminder_cards', [
                { id: 'sinopac', name: '永豐銀行', dueDate: 15, billCycle: '每月25日結帳', color: 'indigo' },
                { id: 'fubon', name: '富邦銀行', dueDate: 18, billCycle: '每月2日結帳', color: 'blue' }
            ]));

            const [bills, setBills] = useState(() => safeGetItem('reminder_bills', [
                { id: '1', cardId: 'sinopac', year: 2026, month: 5, amount: 13716, isPaid: false },
                { id: '2', cardId: 'fubon', year: 2026, month: 5, amount: 9000, isPaid: false },
                { id: '3', cardId: 'sinopac', year: 2026, month: 6, amount: 0, isPaid: false },
                { id: '4', cardId: 'fubon', year: 2026, month: 6, amount: 0, isPaid: false },
                { id: '5', cardId: 'sinopac', year: 2026, month: 7, amount: 0, isPaid: false },
                { id: '6', cardId: 'fubon', year: 2026, month: 7, amount: 0, isPaid: false }
            ]));

            const [alertDayOfMonth, setAlertDayOfMonth] = useState(() => safeGetItem('reminder_alert_day', 5));
            const [remindDaysBefore, setRemindDaysBefore] = useState(() => safeGetItem('reminder_days_before', 3));
            const [isNoonReminderEnabled, setIsNoonReminderEnabled] = useState(() => safeGetItem('reminder_noon_enabled', true));
            const [fontSizeScale, setFontSizeScale] = useState(() => safeGetItem('reminder_font_size_scale', 100));

            // 【雲端大腦專屬網址，自動預填】
            const [gasUrl, setGasUrl] = useState(() => {
                try {
                    return localStorage.getItem('reminder_gas_url') || 'https://script.google.com/macros/s/AKfycbxpZY69J1cWryjVU3wrZ014ceAq8WfJ4vfENns-xsBdYlW4zInXo8M3fAz1dd8I5TBE/exec';
                } catch(e) {
                    return 'https://script.google.com/macros/s/AKfycbxpZY69J1cWryjVU3wrZ014ceAq8WfJ4vfENns-xsBdYlW4zInXo8M3fAz1dd8I5TBE/exec';
                }
            });
            const [isSyncing, setIsSyncing] = useState(false);

            const [notificationPermission, setNotificationPermission] = useState('default');
            const [editingCell, setEditingCell] = useState(null);
            const [editValue, setEditValue] = useState('');
            const [toast, setToast] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // 下拉新增月份的預設數值，自動帶入下個月
            const [newMonthVal, setNewMonthVal] = useState(() => {
                const next = TODAY.getMonth() + 2; 
                return next > 12 ? 1 : next;
            });
            const [showResetConfirm, setShowResetConfirm] = useState(false);

            // 當狀態改變時，寫入 LocalStorage 儲存
            useEffect(() => { safeSetItem('reminder_cards', cards); }, [cards]);
            useEffect(() => { safeSetItem('reminder_bills', bills); }, [bills]);
            useEffect(() => { safeSetItem('reminder_alert_day', alertDayOfMonth); }, [alertDayOfMonth]);
            useEffect(() => { safeSetItem('reminder_days_before', remindDaysBefore); }, [remindDaysBefore]);
            useEffect(() => { safeSetItem('reminder_noon_enabled', isNoonReminderEnabled); }, [isNoonReminderEnabled]);
            useEffect(() => {
                try {
                    localStorage.setItem('reminder_gas_url', gasUrl);
                } catch(e) {}
            }, [gasUrl]);

            // 當字體大小改變時，調整 HTML 根節點的字體尺寸以達到無級全螢幕縮放
            useEffect(() => {
                safeSetItem('reminder_font_size_scale', fontSizeScale);
                document.documentElement.style.fontSize = `${fontSizeScale}%`;
            }, [fontSizeScale]);

            useEffect(() => {
                if ('Notification' in window) {
                    setNotificationPermission(Notification.permission);
                }
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const syncWithCloud = async (forceTriggerAlert = false, autoMergeData = null) => {
                if (!gasUrl) {
                    if (forceTriggerAlert) showToast('請先至設定分頁貼上您的 Google 部署網址喔！', 'warning');
                    return;
                }
                setIsSyncing(true);
                try {
                    if (autoMergeData) {
                        await fetch(gasUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'saveBills', bills: autoMergeData })
                        });
                        setBills(autoMergeData);
                        setIsSyncing(false);
                        return;
                    }

                    const response = await fetch(gasUrl, { method: 'GET', redirect: 'follow' });
                    if (response.ok) {
                        const cloudBills = await response.json();
                        if (Array.isArray(cloudBills) && cloudBills.length > 0) {
                            const mergedBills = bills.map(localBill => {
                                const cloudMatched = cloudBills.find(cb => cb.cardId === localBill.cardId && cb.month === localBill.month && cb.year === localBill.year);
                                if (cloudMatched) {
                                    return {
                                        ...localBill,
                                        amount: cloudMatched.amount !== undefined ? cloudMatched.amount : localBill.amount,
                                        isPaid: localBill.isPaid
                                    };
                                }
                                return localBill;
                            });

                            cloudBills.forEach(cb => {
                                const exist = mergedBills.some(lb => lb.cardId === cb.cardId && lb.month === cb.month && lb.year === cb.year);
                                if (!exist) {
                                    mergedBills.push(cb);
                                }
                            });

                            setBills(mergedBills);
                            safeSetItem('reminder_bills', mergedBills);
                            if (forceTriggerAlert) showToast('⚡ 與 Gmail 帳單同步完成！金額已自動對帳！');
                        } else {
                            await fetch(gasUrl, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: 'saveBills', bills: bills })
                            });
                            if (forceTriggerAlert) showToast('☁️ 雲端同步初始化成功！');
                        }
                    } else {
                        throw new Error('Sync failed');
                    }
                } catch (e) {
                    console.error(e);
                    if (forceTriggerAlert) showToast('❌ 同步失敗，請確認您的部署網址是否正確並開啟了權限。', 'warning');
                }
                setIsSyncing(false);
            };

            // 每次 App 啟動時自動進行雲端默默對齊
            useEffect(() => {
                if (gasUrl) {
                    syncWithCloud(false);
                }
            }, [gasUrl]);

            // 【逆向防漏狀態判定】
            const getBillStatus = (bill, card) => {
                if (bill.isPaid) {
                    if (bill.amount === 0) {
                        return { code: 'NO_SPENDING', text: '🟢 本月無消費', color: 'text-slate-400 bg-slate-900/60 border-slate-800', daysLeft: null };
                    }
                    return { code: 'PAID', text: '🟢 已繳清', color: 'text-emerald-400 bg-emerald-950/40 border-emerald-900/60', daysLeft: null };
                }

                const isBillMonthArrived = (bill.year < TODAY.getFullYear()) || 
                                           (bill.year === TODAY.getFullYear() && bill.month <= (TODAY.getMonth() + 1));

                if (bill.amount === 0 && isBillMonthArrived) {
                    return { 
                        code: 'UNCONFIRMED', 
                        text: '⚠️ 待確認帳單', 
                        color: 'text-amber-400 bg-amber-950/40 border-amber-900/60 animate-pulse font-bold', 
                        daysLeft: 0 
                    };
                }

                if (bill.amount === 0) {
                    return { code: 'EMPTY', text: '未開期', color: 'text-gray-500 bg-slate-900/20 border-slate-800', daysLeft: null };
                }

                const dueDateObj = new Date(bill.year, bill.month - 1, card.dueDate);
                const diffTime = dueDateObj - TODAY;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays < 0) {
                    return { 
                        code: 'OVERDUE', 
                        text: `🚨 已逾期 ${Math.abs(diffDays)} 天`, 
                        color: 'text-rose-400 bg-rose-950/50 border-rose-900 animate-pulse font-bold', 
                        daysLeft: diffDays 
                    };
                } else if (diffDays <= remindDaysBefore) {
                    return { 
                        code: 'WARNING', 
                        text: `⏰ 剩餘 ${diffDays} 天`, 
                        color: 'text-amber-400 bg-amber-950/40 border-amber-900/60 font-bold', 
                        daysLeft: diffDays 
                    };
                } else {
                    return { 
                        code: 'SAFE', 
                        text: `剩餘 ${diffDays} 天`, 
                        color: 'text-cyan-400 bg-cyan-950/30 border-cyan-900/60', 
                        daysLeft: diffDays 
                    };
                }
            };

            const stats = useMemo(() => {
                let totalUnpaid = 0;
                let overdueCount = 0;
                let upcomingCount = 0;
                let unconfirmedCount = 0;
                const alertList = [];

                bills.forEach(bill => {
                    const card = cards.find(c => c.id === bill.cardId);
                    if (!card) return;
                    const status = getBillStatus(bill, card);

                    if (bill.amount > 0 && !bill.isPaid) {
                        totalUnpaid += bill.amount;
                        if (status.code === 'OVERDUE') {
                            overdueCount++;
                            alertList.push({ bill, card, status, priority: 1 });
                        } else if (status.code === 'WARNING') {
                            upcomingCount++;
                            alertList.push({ bill, card, status, priority: 2 });
                        }
                    } else if (status.code === 'UNCONFIRMED') {
                        unconfirmedCount++;
                        alertList.push({ bill, card, status, priority: 3 });
                    }
                });

                return { totalUnpaid, overdueCount, upcomingCount, unconfirmedCount, alertList };
            }, [bills, cards, remindDaysBefore, TODAY]);

            // iOS 原生通知觸發
            const triggerNativeNotification = (title, body) => {
                if (!('Notification' in window)) return false;
                if (Notification.permission === 'granted') {
                    try {
                        const options = {
                            body: body,
                            icon: 'https://cdn-icons-png.flaticon.com/512/1155/1155050.png',
                            badge: 'https://cdn-icons-png.flaticon.com/512/1155/1155050.png',
                            tag: 'card-overdue-alert',
                            requireInteraction: true
                        };
                        new Notification(title, options);
                        return true;
                    } catch (err) {
                        console.error('通知發送失敗:', err);
                        return false;
                    }
                }
                return false;
            };

            const hasAutoChecked = useRef(false);
            useEffect(() => {
                if (hasAutoChecked.current) return;

                const urlParams = new URLSearchParams(window.location.search);
                const isFromShortcut = urlParams.get('source') === 'shortcut';

                if (isFromShortcut && isNoonReminderEnabled) {
                    hasAutoChecked.current = true;
                    const timer = setTimeout(() => {
                        const performCheck = () => {
                            const hasOverdue = stats.overdueCount > 0;
                            const hasUnconfirmed = stats.unconfirmedCount > 0;

                            if (hasOverdue || hasUnconfirmed) {
                                let title = '🚨 卡費防漏警戒提醒！';
                                let body = '';

                                if (hasOverdue) {
                                    const overdueDetails = stats.alertList
                                        .filter(item => item.status.code === 'OVERDUE')
                                        .map(item => `【${item.card.name}】$${item.bill.amount.toLocaleString()}`)
                                        .join(', ');
                                    body += `您有 ${stats.overdueCount} 筆卡費已逾期 (${overdueDetails})！`;
                                }

                                if (hasUnconfirmed) {
                                    const unconfirmedDetails = stats.alertList
                                        .filter(item => item.status.code === 'UNCONFIRMED')
                                        .map(item => `【${item.card.name} ${item.bill.month}月】`)
                                        .join(', ');
                                    if (body) body += ' 另外，';
                                    body += `發現未確認帳單 ${unconfirmedDetails}，請上網銀確認金額或標記「無消費」！`;
                                }
                                
                                triggerNativeNotification(title, body);
                                showToast('🔔 捷徑對帳：已自動發送系統提醒！');
                            } else {
                                showToast('☕ 捷徑對帳：巡檢完成，所有卡費均已核銷清空。', 'success');
                            }
                        };

                        if (gasUrl) {
                            syncWithCloud(false).then(() => performCheck());
                        } else {
                            performCheck();
                        }
                    }, 1200);
                    return () => clearTimeout(timer);
                }
            }, [stats.overdueCount, stats.unconfirmedCount, isNoonReminderEnabled, gasUrl]);

            const requestNotificationPermission = async () => {
                if (!('Notification' in window)) {
                    showToast('⚠️ 您的瀏覽器暫不支援網頁通知。請先將本網頁「加入主畫面」後再試！', 'warning');
                    return;
                }

                try {
                    const permission = await Notification.requestPermission();
                    setNotificationPermission(permission);
                    if (permission === 'granted') {
                        showToast('🎉 通知權限授權成功！');
                        triggerNativeNotification('🔔 卡費管家', '定時巡檢通知已成功開啟！');
                    } else {
                        showToast('😢 權限遭拒。請前往 iPhone 的「設定」>「通知」>「卡費管家」開啟通知。', 'warning');
                    }
                } catch (e) {
                    showToast('請先將此網頁「加入主畫面」成為桌面 App 才能開啟通知！', 'warning');
                }
            };

            const simulateNoonCheck = () => {
                if (!isNoonReminderEnabled) {
                    showToast('您已在設定中關閉了自動提醒。', 'info');
                    return;
                }

                const hasOverdue = stats.overdueCount > 0;
                const hasUnconfirmed = stats.unconfirmedCount > 0;

                if (hasOverdue || hasUnconfirmed) {
                    let title = '🚨 卡費防漏定時巡檢';
                    let body = '';

                    if (hasOverdue) {
                        const overdueDetails = stats.alertList
                            .filter(item => item.status.code === 'OVERDUE')
                            .map(item => `【${item.card.name}】$${item.bill.amount.toLocaleString()}`)
                            .join(', ');
                        body += `有 ${stats.overdueCount} 筆卡費過期 (${overdueDetails})。`;
                    }

                    if (hasUnconfirmed) {
                        const unconfirmedDetails = stats.alertList
                            .filter(item => item.status.code === 'UNCONFIRMED')
                            .map(item => `【${item.card.name} ${item.bill.month}月】`)
                            .join(', ');
                        if (body) body += ' 另外，';
                        body += `有未確認帳單 ${unconfirmedDetails}，請核對網銀以防漏繳！`;
                    }
                    
                    const sent = triggerNativeNotification(title, body);
                    if (sent) {
                        showToast('🔔 成功在手機系統頂部彈出「定時對帳通知」！');
                    } else {
                        showToast(`📱 手機模擬通知：\n${title}\n${body}`, 'warning');
                    }
                } else {
                    showToast('☕ 檢查完成：目前沒有任何逾期或未確認帳單。您真守信！', 'success');
                }
            };

            const handleSaveAmount = (billId) => {
                const numVal = parseFloat(editValue);
                if (isNaN(numVal) || numVal < 0) {
                    showToast('請輸入正確的金額數字', 'error');
                    return;
                }
                const updated = bills.map(b => b.id === billId ? { ...b, amount: numVal, isPaid: false } : b);
                setEditingCell(null);
                
                if (gasUrl) {
                    syncWithCloud(false, updated);
                    showToast('帳單金額已更新，並成功同步至雲端！ ☁️');
                } else {
                    setBills(updated);
                    showToast('帳單金額已更新並安全儲存在本地！ 💾');
                }
            };

            const togglePaid = (billId) => {
                const updated = bills.map(b => {
                    if (b.id === billId) {
                        const nextState = !b.isPaid;
                        showToast(nextState ? '🎉 已標記為已繳清！中午不會再跳出通知了。' : '帳單已被設定回未繳狀態。', nextState ? 'success' : 'info');
                        return { ...b, isPaid: nextState };
                    }

                                            App 開啟或中午 12:00 捷徑排程執行時，將自動連線讀取 Gmail 最新的單筆消費與對帳單金額。
                                        </p>
                                        {gasUrl && (
                                            <button 
                                                onClick={() => syncWithCloud(true)}
                                                disabled={isSyncing}
                                                className="w-full py-1.5 bg-indigo-600 active:bg-indigo-700 text-white text-[10px] font-bold rounded-lg transition-transform active:scale-95 flex items-center justify-center gap-1 shadow-md shadow-indigo-950/50"
                                            >
                                                <CloudIcon className={`w-3 h-3 ${isSyncing ? 'animate-spin' : ''}`} />
                                                {isSyncing ? '資料同步中...' : '立刻手動同步 Gmail 最新帳單'}
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* iOS 系統推播設定 */}
                                <div className="border-b border-slate-900 pb-4 space-y-3">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-xl bg-indigo-950/80 border border-indigo-800/40 flex items-center justify-center text-cyan-400 shrink-0 shadow-inner relative">
                                            <BellIcon className="w-5 h-5 text-cyan-400" />
                                            <div className="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 bg-cyan-400 rounded-full"></div>
                                        </div>
                                        <div>
                                            <h3 className="text-xs font-bold text-slate-100 flex items-center gap-1.5 font-mono">
                                                IOS系統通知
                                                <span className="text-[7px] font-mono text-cyan-400 border border-cyan-500/30 px-1 rounded">實時排程</span>
                                            </h3>
                                            <p className="text-[9px] text-slate-400">中午 12:00 手機定時防漏警報</p>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-900 space-y-2">
                                        <div className="flex items-center justify-between text-[10px]">
                                            <span className="text-slate-400">對帳警報時間：</span>
                                            <span className="font-extrabold text-cyan-400 font-mono">[ 中午 12:00 ]</span>
                                        </div>
                                        <p className="text-[8.5px] text-slate-400 leading-snug">
                                            每天中午若有「已逾期」或「未確認對帳」卡費，手機會準時彈出系統橫幅提醒您。
                                        </p>

                                        <div className="pt-1 flex items-center space-x-3 text-[10px]">
                                            <label className="flex items-center space-x-1.5 text-slate-300 font-bold cursor-pointer">
                                                <input
                                                    type="radio"
                                                    checked={isNoonReminderEnabled === true}
                                                    onChange={() => setIsNoonReminderEnabled(true)}
                                                    className="rounded scale-90 text-cyan-400 bg-slate-900 border-slate-800"
                                                />
                                                <span>開啟提醒</span>
                                            </label>
                                            <label className="flex items-center space-x-1.5 text-slate-300 font-bold cursor-pointer">
                                                <input
                                                    type="radio"
                                                    checked={isNoonReminderEnabled === false}
                                                    onChange={() => setIsNoonReminderEnabled(false)}
                                                    className="rounded scale-90 text-cyan-400 bg-slate-900 border-slate-800"
                                                />
                                                <span>關閉提醒</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                {/* 字體大小調節拉桿區 */}
                                <div className="border-b border-slate-900 pb-4 space-y-3">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-xl bg-indigo-950/80 border border-indigo-800/40 flex items-center justify-center text-cyan-400 shrink-0 shadow-inner">
                                            <svg className="w-5 h-5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                                <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
                                            </svg>
                                        </div>
                                        <div>
                                            <h3 className="text-xs font-bold text-slate-100 font-mono">介面無級縮放</h3>
                                            <p className="text-[9px] text-slate-400">自由微調全螢幕字體比例</p>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-900 space-y-2">
                                        <div className="flex items-center justify-between text-[10px]">
                                            <span className="text-slate-400">尺寸比例：<strong className="text-cyan-400">{fontSizeScale}%</strong></span>
                                            <button 
                                                onClick={() => {
                                                    setFontSizeScale(100);
                                                    showToast('字體比例已恢復為預設的 100%');
                                                }}
                                                className="text-[8px] bg-slate-900 border border-slate-800 text-slate-300 font-bold px-1.5 py-0.5 rounded active:scale-95 transition-transform"
                                            >
                                                重設
                                            </button>
                                        </div>
                                        
                                        <div className="flex items-center space-x-2">
                                            <span className="text-[9px] font-bold text-slate-500">小</span>
                                            <input 
                                                type="range" 
                                                min="80" 
                                                max="150" 
                                                step="5"
                                                value={fontSizeScale} 
                                                onChange={(e) => setFontSizeScale(parseInt(e.target.value))}
                                                className="flex-1 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400"
                                            />
                                            <span className="text-[10px] font-black text-slate-300">大</span>
                                        </div>
                                    </div>
                                </div>

                                {/* 卡片基本截止日維護 */}
                                <div className="border-b border-slate-900 pb-4 space-y-2">
                                    <h3 className="text-xs font-bold text-slate-100 flex items-center gap-1.5 font-mono">
                                        <CreditCardIcon className="text-cyan-400 shrink-0" />
                                        信用卡結帳週期
                                    </h3>

                                    <div className="grid grid-cols-2 gap-2">
                                        {cards.map((card, index) => (
                                            <div key={card.id} className="border border-slate-900 rounded-xl p-2 bg-slate-950/50 flex flex-col justify-between">
                                                <div>
                                                    <h4 className="text-[11px] font-bold text-slate-100">{card.name}</h4>
                                                    <p className="text-[8.5px] text-slate-500 font-medium font-mono">{card.billCycle}</p>
                                                </div>

                                                <div className="flex items-center justify-between mt-1.5 pt-1.5 border-t border-slate-900">
                                                    <span className="text-[9px] text-slate-400">截止繳款:</span>
                                                    <div className="flex items-center space-x-1">
                                                        <input
                                                            type="number"
                                                            min="1"
                                                            max="31"
                                                            value={card.dueDate}
                                                            onChange={(e) => {
                                                                const val = Math.min(31, Math.max(1, parseInt(e.target.value) || 1));
                                                                setCards(prev => prev.map((c, i) => i === index ? { ...c, dueDate: val } : c));
                                                            }}
                                                            className="w-8 p-0.5 text-[10px] text-center bg-slate-900 border border-slate-800 rounded font-black text-cyan-400 focus:outline-none"
                                                        />
                                                        <span className="text-[9px] text-slate-500">日</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* 防逾期警戒參數 */}
                                <div className="space-y-2">
                                    <h3 className="text-xs font-bold text-slate-100 flex items-center gap-1.5 font-mono">
                                        <BellIcon className="text-cyan-400 shrink-0" />
                                        警報觸發參數設定
                                    </h3>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div className="bg-slate-950/50 border border-slate-900 p-2 rounded-xl">
                                            <label className="block text-[8.5px] font-bold text-slate-500 mb-1 font-mono">
                                                [ 固定警戒日 ]
                                            </label>
                                            <div className="flex items-center gap-1 text-[10px]">
                                                <span>每月</span>
                                                <input
                                                    type="number"
                                                    min="1"
                                                    max="31"
                                                    value={alertDayOfMonth}
                                                    onChange={(e) => {
                                                        const val = Math.min(31, Math.max(1, parseInt(e.target.value) || 1));
                                                        setAlertDayOfMonth(val);
                                                        showToast(`已變更警戒日為每月 ${val} 號`);
                                                    }}
                                                    className="w-8 p-0.5 text-center border border-slate-800 rounded font-black text-cyan-400 bg-slate-900"
                                                />
                                                <span>號過後警示</span>
                                            </div>
                                        </div>

                                        <div className="bg-slate-950/50 border border-slate-900 p-2 rounded-xl">
                                            <label className="block text-[8.5px] font-bold text-slate-500 mb-1 font-mono">
                                                [ 提前預警天數 ]
                                            </label>
                                            <div className="flex items-center gap-2 mt-0.5">
                                                <label className="flex items-center space-x-1 text-[10px] font-medium cursor-pointer">
                                                    <input
                                                        type="radio"
                                                        name="daysbefore"
                                                        checked={remindDaysBefore === 3}
                                                        onChange={() => setRemindDaysBefore(3)}
                                                        className="scale-90 text-cyan-400 bg-slate-900 border-slate-800"
                                                    />
                                                    <span>3天前</span>
                                                </label>
                                                <label className="flex items-center space-x-1 text-[10px] font-medium cursor-pointer">
                                                    <input
                                                        type="radio"
                                                        name="daysbefore"
                                                        checked={remindDaysBefore === 5}
                                                        onChange={() => setRemindDaysBefore(5)}
                                                        className="scale-90 text-cyan-400 bg-slate-900 border-slate-800"
                                                    />
                                                    <span>5天前</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'tips' && (
                            <div className="bg-[#111625]/80 rounded-2xl border border-slate-900 shadow-xl p-4 space-y-4 relative">
                                <div className="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-indigo-500/20 to-transparent"></div>
                                
                                <div>
                                    <h2 className="text-sm font-bold text-slate-100 flex items-center gap-1.5">
                                        <LightBulbIcon className="text-amber-500 w-4 h-4" />
                                        防漏繳終極設定（Gmail 自動對帳 與 捷徑自動化）
                                    </h2>
                                    <p className="text-[9px] text-slate-400">以下兩大核心步驟，將徹底把您的卡費管家升級成無懈可擊的原生 App！</p>
                                </div>

                                <div className="space-y-3">
                                    <div className="bg-indigo-950/20 p-4 rounded-xl border border-indigo-900/40">
                                        <div className="text-xs font-extrabold text-cyan-400 mb-1.5 font-mono">[ 第一階段：GMAIL 雲端部署 ]</div>
                                        <p className="text-[11px] text-slate-300 leading-relaxed mb-2">
                                            只要將 Google Apps Script 設定好，Google 後台每天都會默默幫您爬信件，抓出永豐與富邦卡費並存入雲端。
                                        </p>
                                        <ol className="list-decimal list-inside text-[11px] text-slate-300 space-y-1 leading-relaxed">
                                            <li>點擊本對話右側的 <strong>`gas_script.js`</strong> 與 <strong>`setup_guide.md`</strong> 檔案。</li>
                                            <li>按照部署指引，取得專屬部署網址並貼到上方 **「通知與卡片」** 設定頁中。</li>
                                            <li>隨後即可按下首頁的 **「同步 Gmail」**，測試是否已能全自動記帳！</li>
                                        </ol>
                                    </div>

                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-900">
                                        <div className="text-xs font-bold text-slate-100 mb-1.5 font-mono">[ 第二階段：捷徑排程設定 ]</div>
                                        <ol className="list-decimal list-inside text-[11px] text-slate-400 space-y-1.5 leading-relaxed">
                                            <li>打開 iPhone 內建的「<strong>捷徑 (Shortcuts)</strong>」App。</li>
                                            <li>切換到下方的「<strong>自動化 (Automation)</strong>」分頁，點選右上角「+」或「製作個人自動化」。</li>
                                            <li>選擇「<strong>特定時間 (Time of Day)</strong>」，設定為「<strong>12:00 PM (中午)</strong>」，重複點選「<strong>每天</strong>」。下方勾選「<strong>立即執行 (Run Immediately)</strong>」，然後按下一步。</li>
                                            <li>點擊「<strong>新增空白自動化</strong>」或「加入動作」，在搜尋框搜尋並選擇「<strong>開啟 URL</strong>」動作。</li>
                                            <li>在網址欄位貼上您的自動對帳專用網址：
                                                <div className="bg-[#0c101b] text-emerald-400 p-2 rounded-lg font-mono text-[10px] my-1 break-all select-all border border-slate-800">
                                                    https://shang0320.github.io/mybot/?source=shortcut
                                                </div>
                                                <span className="text-rose-400 font-bold">（⚠️請注意：網址結尾一定要加上 ?source=shortcut，這樣一打開才會全自動對帳並噴出通知！）</span>
                                            </li>
                                            <li>點選右上角「<strong>完成</strong>」儲存！</li>
                                        </ol>
                                    </div>

                                    <div className="bg-amber-950/20 p-3 rounded-xl border border-amber-100 text-[10px] text-slate-300 leading-relaxed">
                                        🎉 <strong>設定完成的效果：</strong><br />
                                        每天中午 12:00，iPhone 會自動喚醒並開啟本 App。<strong>只要此時有任何逾期卡費，手機頂部會瞬間震動並自動跳出警告推播通知！</strong>如果今天卡費全部都已經按「一鍵已繳」標記完成了，App 就會保持安靜。
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
